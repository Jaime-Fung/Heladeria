spring.application.name=backend

#Correr la base de datos en la nube
#Si la red de la base de datos esta publica, puedes acceder a ella desde el backend local
#Si la red de la base de datos esta privada, puedes acceder a ella solo poniendo el backend desplegado en la nube
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



